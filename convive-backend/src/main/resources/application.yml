spring:
  application:
    nombre: convive-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/convive?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    usuarionombre: ${DB_USERNAME:convive_usuario}
    password: ${DB_PASSWORD:change_me_local}
    driver-class-nombre: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:upfecha}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:warn}
