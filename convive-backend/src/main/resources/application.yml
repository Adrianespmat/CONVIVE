spring:
  application:
    name: convive-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/convive?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:convive_user}
    password: ${DB_PASSWORD:change_me_local}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

convive:
  seguridad:
    jwt-secret: ${JWT_SECRET:clave-local-de-desarrollo-convive-cambiar-en-produccion-123456}
    expiracion-milisegundos: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:warn}
